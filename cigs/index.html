<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cigs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="A tiny cigarette and spliff counter that lives on your phone.">
<meta name="theme-color" id="theme-light" content="#CFE3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="theme-dark" content="#13202E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cigs">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="stylesheet" href="./app.css">
<script>try{if(localStorage.getItem('cigs.mode')==='spliff')document.documentElement.setAttribute('data-mode','spliff');}catch(e){}</script>
</head>
<body>
<div id="app">

  <!-- ============ Main ============ -->
  <main class="view view-main" id="view-main">
    <header class="topbar">
      <button class="round-btn" id="btn-stats" type="button" aria-label="Statistics">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M4 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <rect x="6" y="11" width="3" height="7" rx="1" fill="currentColor"/>
          <rect x="11" y="5" width="3" height="13" rx="1" fill="currentColor"/>
          <rect x="16" y="13" width="3" height="5" rx="1" fill="currentColor"/>
        </svg>
      </button>
      <h1 class="topbar-title visually-hidden" id="main-title">Cigs</h1>
      <button class="mode-toggle" type="button" role="switch" aria-checked="false" aria-label="Spliff mode" data-mode-toggle>
        <span class="mode-thumb" aria-hidden="true"></span>
        <svg class="mode-ico mode-ico-cig" viewBox="0 0 22 10" width="22" height="10" aria-hidden="true">
          <rect x="0" y="1.5" width="6" height="7" rx="1.5" opacity="0.55"/>
          <rect x="6" y="1.5" width="12" height="7"/>
          <rect x="18" y="1.5" width="4" height="7" rx="1.5"/>
        </svg>
        <svg class="mode-ico mode-ico-spliff" viewBox="0 0 22 12" width="22" height="12" aria-hidden="true">
          <rect x="0" y="3.5" width="5" height="5" rx="1" opacity="0.55"/>
          <path d="M5 3.5 L17 0.5 L17 11.5 L5 8.5 Z"/>
          <path d="M17 1.5 L22 4.5 L22 7.5 L17 10.5 Z" opacity="0.8"/>
        </svg>
      </button>
    </header>

    <div class="main-body">
      <section class="counter">
        <div class="counter-num" id="main-count" aria-live="polite">0</div>
        <div class="counter-label">today</div>
        <button class="undo-btn" id="btn-undo" type="button" hidden>Undo</button>
      </section>

      <button class="disk" id="btn-log" type="button" aria-label="Log a cigarette">
        <svg class="cig" id="art-cig" viewBox="0 0 260 260" aria-hidden="true">
          <defs>
            <clipPath id="cig-clip"><rect id="cig-clip-rect" x="0" y="0" width="190" height="260"/></clipPath>
            <radialGradient id="cig-glow-grad">
              <stop offset="0" stop-color="#FFC26B" stop-opacity="0.95"/>
              <stop offset="0.45" stop-color="#FF7A59" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <!-- smoke stays upright, outside the rotated group -->
          <g id="cig-smoke" class="cig-smoke">
            <path d="M187.3 59.6 A6.5 6.5 0 1 1 187.3 48.4"/>
            <path d="M202.8 56.8 A5.5 5.5 0 1 1 202.8 47.2"/>
          </g>
          <g transform="rotate(-24 130 130)">
            <g clip-path="url(#cig-clip)">
              <rect class="cig-body" x="96" y="114" width="92" height="32"/>
            </g>
            <path class="cig-filter" d="M68 114 H96 V146 H68 A16 16 0 0 1 68 114 Z"/>
            <path class="cig-filter-lines" d="M66 121 V139 M74 121 V139 M82 121 V139"/>
            <g id="cig-tip">
              <g id="cig-ash" class="cig-ash" opacity="0">
                <ellipse cx="182" cy="130" rx="6" ry="11"/>
                <circle class="cig-ashbit" cx="184" cy="140" r="2"/>
                <circle class="cig-ashbit" cx="189" cy="136" r="1.5"/>
              </g>
              <path id="cig-cap" class="cig-cap" d="M180 114 H192 A16 16 0 0 1 192 146 H180 Z"/>
              <circle id="cig-ember" cx="196" cy="130" r="5.5" fill="#FFD36B"/>
              <circle id="cig-glow" cx="197" cy="130" r="28" fill="url(#cig-glow-grad)" opacity="0"/>
            </g>
          </g>
        </svg>
        <svg class="cig spliff" id="art-spliff" viewBox="0 0 260 260" aria-hidden="true" hidden>
          <defs>
            <clipPath id="spliff-clip"><rect id="spliff-clip-rect" x="0" y="0" width="190" height="260"/></clipPath>
            <radialGradient id="spliff-glow-grad">
              <stop offset="0" stop-color="#FFC26B" stop-opacity="0.95"/>
              <stop offset="0.45" stop-color="#FF7A59" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#FF7A59" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <g id="spliff-smoke" class="cig-smoke">
            <path d="M191.3 54.6 A6.5 6.5 0 1 1 191.3 43.4"/>
            <path d="M206.8 51.8 A5.5 5.5 0 1 1 206.8 42.2"/>
          </g>
          <g transform="rotate(-24 130 130)">
            <!-- the paper cone, clipped on the right as it burns -->
            <g clip-path="url(#spliff-clip)">
              <path class="spliff-paper" d="M96 121 Q140 112 188 110 L188 150 Q140 148 96 139 Z"/>
              <path class="spliff-seam" d="M100 128 Q144 121 186 118"/>
              <path class="spliff-seam" d="M100 133 Q144 136 186 142"/>
            </g>
            <!-- rolled cardboard roach -->
            <path class="spliff-roach" d="M70 121 H96 V139 H70 A9 9 0 0 1 70 121 Z"/>
            <path class="spliff-roach-lines" d="M74 124 Q70 130 74 136 M80 123 Q76 130 80 137 M86 123 Q82 130 86 137"/>
            <g id="spliff-tip">
              <g id="spliff-ash" class="cig-ash" opacity="0">
                <ellipse cx="184" cy="130" rx="6" ry="14"/>
                <circle class="spliff-ashbit" cx="186" cy="142" r="2"/>
                <circle class="spliff-ashbit" cx="191" cy="137" r="1.5"/>
              </g>
              <!-- twisted paper end, charred where it burns -->
              <path id="spliff-cap" class="spliff-twist" d="M188 110 Q196 117 198 124 L206 121 Q211 130 206 139 L198 136 Q196 143 188 150 Z"/>
              <path class="spliff-twist-lines" d="M199 127 L205 125 M199 133 L205 135 M192 118 L194 122 M192 142 L194 138"/>
              <circle id="spliff-ember" cx="209" cy="130" r="5.5" fill="#FFD36B"/>
              <circle id="spliff-glow" cx="210" cy="130" r="30" fill="url(#spliff-glow-grad)" opacity="0"/>
            </g>
          </g>
        </svg>
      </button>

      <section class="today-row">
        <div class="glyphs" id="glyphs" aria-hidden="true"></div>
        <div class="last-one" id="main-last">no cigarette yet</div>
      </section>
    </div>
  </main>

  <!-- ============ Statistics ============ -->
  <section class="view view-stats" id="view-stats" hidden>
    <header class="topbar">
      <button class="round-btn" id="btn-back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="topbar-title">Statistics</h1>
      <button class="mode-toggle" type="button" role="switch" aria-checked="false" aria-label="Spliff mode" data-mode-toggle>
        <span class="mode-thumb" aria-hidden="true"></span>
        <svg class="mode-ico mode-ico-cig" viewBox="0 0 22 10" width="22" height="10" aria-hidden="true">
          <rect x="0" y="1.5" width="6" height="7" rx="1.5" opacity="0.55"/>
          <rect x="6" y="1.5" width="12" height="7"/>
          <rect x="18" y="1.5" width="4" height="7" rx="1.5"/>
        </svg>
        <svg class="mode-ico mode-ico-spliff" viewBox="0 0 22 12" width="22" height="12" aria-hidden="true">
          <rect x="0" y="3.5" width="5" height="5" rx="1" opacity="0.55"/>
          <path d="M5 3.5 L17 0.5 L17 11.5 L5 8.5 Z"/>
          <path d="M17 1.5 L22 4.5 L22 7.5 L17 10.5 Z" opacity="0.8"/>
        </svg>
      </button>
    </header>
    <div class="segmented" role="tablist" aria-label="Statistics sections" id="segmented">
      <span class="segmented-thumb" aria-hidden="true"></span>
      <button class="segment" role="tab" type="button" data-seg="today" aria-selected="true" aria-controls="panel-today">Today</button>
      <button class="segment" role="tab" type="button" data-seg="stats" aria-selected="false" aria-controls="panel-stats">Stats</button>
      <button class="segment" role="tab" type="button" data-seg="timeline" aria-selected="false" aria-controls="panel-timeline">Timeline</button>
    </div>
    <div class="scroll" id="stats-scroll">
      <section class="panel" id="panel-today" role="tabpanel"></section>
      <section class="panel" id="panel-stats" role="tabpanel" hidden></section>
      <section class="panel" id="panel-timeline" role="tabpanel" hidden></section>
      <button class="settings-btn" id="btn-settings" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
        </svg>
        Settings
      </button>
    </div>
  </section>

  <!-- ============ Settings sheet ============ -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" aria-hidden="true">
    <div class="sheet-handle" aria-hidden="true"></div>
    <h2 class="sheet-title" id="sheet-title">Settings</h2>
    <div class="sheet-list">
      <button class="sheet-row" id="btn-export" type="button">
        <span class="sheet-row-main">Export backup</span>
        <span class="sheet-row-sub" id="export-sub"></span>
      </button>
      <button class="sheet-row" id="btn-import" type="button">
        <span class="sheet-row-main">Import backup</span>
        <span class="sheet-row-sub">merges a cigs-backup file</span>
      </button>
      <input type="file" id="file-import" accept="application/json,.json" hidden>
      <label class="sheet-row" for="toggle-sound">
        <span class="sheet-row-main">Sound</span>
        <input type="checkbox" class="switch" id="toggle-sound" role="switch">
      </label>
      <button class="sheet-row danger" id="btn-delete-all" type="button" aria-expanded="false" aria-controls="delete-confirm">
        <span class="sheet-row-main">Delete all data</span>
      </button>
      <div class="delete-confirm" id="delete-confirm" hidden>
        <label for="delete-input">Type DELETE to confirm. This cannot be undone.</label>
        <div class="delete-confirm-row">
          <input id="delete-input" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="DELETE">
          <button class="btn-danger" id="btn-delete-confirm" type="button" disabled>Delete</button>
        </div>
      </div>
    </div>
    <button class="sheet-close" id="btn-sheet-close" type="button">Close</button>
  </div>

  <!-- ============ Toast ============ -->
  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-action" hidden>Undo</button>
  </div>
</div>

<script src="./stats.js"></script>
<script src="./app.js"></script>
</body>
</html>
